name: VitalSync CI/CD

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npx eslint server.js test/health.test.js

      - name: Run tests
        run: npm test

  build-push:
    runs-on: ubuntu-latest
    needs: lint-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build backend image
        run: docker build -t ghcr.io/${{ github.repository }}/backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: docker build -t ghcr.io/${{ github.repository }}/frontend:${{ github.sha }} ./frontend

      - name: Push backend image
        run: docker push ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      - name: Push frontend image
        run: docker push ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "POSTGRES_DB=vitalsync" > .env
          echo "POSTGRES_USER=admin" >> .env
          echo "POSTGRES_PASSWORD=admin123" >> .env

      - name: Start staging environment
        run: docker compose up -d --build

      - name: Wait for backend
        run: sleep 10

      - name: Health check
        run: curl --fail http://localhost:3000/health

      - name: Stop containers
        if: always()
        run: docker compose down